<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily · Nick Carbone</title>
  <meta name="description" content="A new researched, designed reference piece every morning, published by Nick Carbone.">
  <meta property="og:title" content="Daily · Nick Carbone">
  <meta property="og:description" content="A new researched piece every morning.">
  <meta property="og:url" content="https://nickcarbone.github.io/daily/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:creator" content="@nickcarbone">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#09090e; --surface:#0e0e16; --surface2:#14141f;
      --border:#1c1c2c; --border-hi:#2c2c42;
      --amber:#c8832a; --amber-lt:#e09a40; --amber-dim:rgba(200,131,42,.08);
      --cream:#e8e2d4; --text:#d8d4c8; --text-dim:#8a8478; --text-muted:#5a5650;
      --ok:#7fae6e; --err:#d0654f;
      --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif; --serif:'Cormorant Garamond',Georgia,serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    .wrap{max-width:820px;margin:0 auto;padding:0 32px}

    nav{display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:1px solid var(--border)}
    .mark{font-family:var(--mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--text-muted);text-decoration:none}
    .mark span{color:var(--amber)}
    .mark:hover{color:var(--text-dim)}
    .owner-links{display:none;gap:18px;list-style:none}
    .owner .owner-links{display:flex}
    .owner-links a{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);text-decoration:none}
    .owner-links a:hover{color:var(--amber-lt)}

    header.mast{padding:84px 0 44px;border-bottom:1px solid var(--border)}
    .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--amber);margin-bottom:18px}
    h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(72px,14vw,132px);line-height:.85;color:var(--cream);letter-spacing:-.015em}
    .standfirst{margin-top:26px;max-width:520px;color:var(--text-dim);font-size:15px;font-weight:300}
    .stats{margin-top:30px;display:flex;flex-wrap:wrap;gap:8px 28px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text-muted)}
    .stats b{color:var(--text);font-weight:400}

    .tools{display:flex;align-items:center;gap:16px;padding:22px 0;border-bottom:1px solid var(--border)}
    .tools input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);color:var(--text);font:inherit;font-size:14px;padding:10px 14px;border-radius:3px;outline:none}
    .tools input:focus{border-color:var(--border-hi)}
    .tools input::placeholder{color:var(--text-muted)}
    .owner-badge{display:none;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
    .owner .owner-badge{display:block}

    .month{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--text-muted);padding:40px 0 4px;display:flex;align-items:center;gap:14px}
    .month::after{content:'';flex:1;height:1px;background:var(--border)}

    article.entry{padding:26px 0 28px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:0 24px;align-items:start}
    article.entry:last-of-type{border-bottom:none}
    .dateline{grid-column:1/-1;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
    .dateline .no{color:var(--text-muted);margin-left:10px}
    .entry h2{font-family:var(--serif);font-weight:600;font-size:clamp(26px,4.4vw,34px);line-height:1.08;color:var(--cream)}
    .entry h2 a{text-decoration:none;background-image:linear-gradient(var(--amber),var(--amber));background-size:0 1px;background-position:0 100%;background-repeat:no-repeat;transition:background-size .3s}
    .entry h2 a:hover{background-size:100% 1px}
    .dek{margin-top:10px;color:var(--text-dim);font-weight:300;max-width:600px}
    .meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
    .meta .corr{color:var(--amber-lt)}
    .read{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);text-decoration:none;white-space:nowrap;padding-top:6px}
    .read:hover{color:var(--amber-lt)}

    .promote{display:none;margin-top:16px;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);cursor:pointer;user-select:none;width:max-content}
    .owner .promote{display:inline-flex}
    .promote input{appearance:none;width:15px;height:15px;border:1px solid var(--border-hi);border-radius:2px;background:var(--surface);display:grid;place-content:center;cursor:pointer}
    .promote input::after{content:'';width:7px;height:7px;background:var(--amber);transform:scale(0);transition:transform .15s}
    .promote input:checked{border-color:var(--amber)}
    .promote input:checked::after{transform:scale(1)}
    .promote input:disabled{opacity:.4;cursor:wait}
    .promote.on{color:var(--amber-lt)}

    .state{padding:80px 0;text-align:center}
    .state h3{font-family:var(--serif);font-style:italic;font-size:30px;color:var(--cream);font-weight:400;margin-bottom:8px}
    .state p{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text-muted)}

    footer{border-top:1px solid var(--border);margin-top:60px;padding:28px 0 40px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text-muted)}
    footer a{color:var(--text-muted);text-decoration:none;text-transform:uppercase;letter-spacing:.12em}
    footer a:hover{color:var(--amber-lt)}

    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--surface2);border:1px solid var(--border-hi);color:var(--text);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:11px 16px;border-radius:3px;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.err{border-color:var(--err);color:#f0b3a6}

    @media (max-width:560px){
      .wrap{padding:0 16px}
      header.mast{padding:56px 0 34px}
      article.entry{grid-template-columns:1fr}
      .read{padding-top:14px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="mark" href="/"><span>Nick</span>Carbone</a>
    <ul class="owner-links">
      <li><a href="https://github.com/nickcarbone/nickcarbone.github.io/edit/main/daily/_desk/QUEUE.md" target="_blank" rel="noopener">Edit queue</a></li>
      <li><a href="https://github.com/nickcarbone/nickcarbone.github.io/issues?q=is%3Aissue+is%3Aopen+label%3Adaily-correction" target="_blank" rel="noopener">Corrections</a></li>
    </ul>
  </nav>

  <header class="mast">
    <p class="eyebrow">nickcarbone.github.io / daily</p>
    <h1>Daily</h1>
    <p class="standfirst">A new piece every morning, researched and designed from scratch. Each one is built to keep, so nothing here goes stale by lunchtime.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="tools">
    <input id="q" type="search" placeholder="Search titles and descriptions" aria-label="Search pieces" autocomplete="off">
    <span class="owner-badge" title="Publisher token found in this browser">Owner mode</span>
  </div>

  <main id="list" aria-live="polite"></main>

  <footer>
    <span>Published each morning, Eastern time</span>
    <a href="https://github.com/nickcarbone/nickcarbone.github.io/issues/new?template=daily-correction.yml" target="_blank" rel="noopener">Suggest a correction</a>
    <a href="/">All pages ↗</a>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const OWNER = 'nickcarbone';
const REPO  = 'nickcarbone.github.io';
const PROMOTED_PATH = 'daily/promoted.json';
const API = 'https://api.github.com';

let pieces = [];
let promoted = new Set();

function token() {
  try { return localStorage.getItem('nc_pub_token') || ''; } catch (e) { return ''; }
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseDay(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
const fmtDay   = iso => parseDay(iso).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
const fmtMonth = iso => parseDay(iso).toLocaleDateString('en-GB', { month:'long', year:'numeric' });
const fmtShort = iso => parseDay(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
const pad3 = n => String(n).padStart(3, '0');

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = 'toast'; }, 4200);
}

async function getJSON(path) {
  const r = await fetch(path + '?v=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(path + ' ' + r.status);
  return r.json();
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = document.getElementById('list');
  const shown = pieces.filter(p => !q || [p.title, p.dek, p.kind].join(' ').toLowerCase().includes(q));

  if (!pieces.length) {
    list.innerHTML = '<div class="state"><h3>The first piece is on its way.</h3><p>New pieces land here each morning.</p></div>';
    return;
  }
  if (!shown.length) {
    list.innerHTML = '<div class="state"><h3>Nothing matches.</h3><p>Try a different word.</p></div>';
    return;
  }
  let html = '', lastMonth = '';
  for (const p of shown) {
    const m = fmtMonth(p.date);
    if (m !== lastMonth) { html += `<div class="month">${esc(m)}</div>`; lastMonth = m; }
    const href = `./${encodeURIComponent(p.slug)}/`;
    const on = promoted.has(p.slug);
    const corr = (p.corrections || []).length;
    html += `
      <article class="entry">
        <div class="dateline"><time datetime="${esc(p.date)}">${esc(fmtDay(p.date))}</time><span class="no">No. ${pad3(p.no)}</span></div>
        <div>
          <h2><a href="${href}">${esc(p.title)}</a></h2>
          ${p.dek ? `<p class="dek">${esc(p.dek)}</p>` : ''}
          <div class="meta">
            ${p.kind ? `<span>${esc(p.kind)}</span>` : ''}
            ${p.readingMinutes ? `<span>${esc(p.readingMinutes)} min read</span>` : ''}
            ${corr ? `<span class="corr">Corrected</span>` : ''}
          </div>
          <label class="promote${on ? ' on' : ''}">
            <input type="checkbox" data-slug="${esc(p.slug)}" ${on ? 'checked' : ''}>
            <span>${on ? 'On main index' : 'Send to main index'}</span>
          </label>
        </div>
        <a class="read" href="${href}">Read →</a>
      </article>`;
  }
  list.innerHTML = html;
}

function renderStats() {
  const el = document.getElementById('stats');
  if (!pieces.length) { el.innerHTML = ''; return; }
  const first = pieces[pieces.length - 1].date;
  el.innerHTML = `<span><b>${pieces.length}</b> piece${pieces.length === 1 ? '' : 's'}</span>
                  <span>Since <b>${esc(fmtShort(first))}</b></span>
                  <span>Latest <b>${esc(fmtShort(pieces[0].date))}</b></span>`;
}

// ── Owner-only: write daily/promoted.json via the GitHub Contents API ─────────
const b64encode = str => { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
const b64decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, '')), c => c.charCodeAt(0)));

async function gh(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', 'Authorization':'Bearer ' + token(), ...(opts.body ? {'Content-Type':'application/json'} : {}) }
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(body.message || ('GitHub ' + r.status)); e.status = r.status; throw e; }
  return body;
}

async function setPromoted(slug, on, attempt = 0) {
  const file = await gh(`/repos/${OWNER}/${REPO}/contents/${PROMOTED_PATH}?ref=main`);
  const data = JSON.parse(b64decode(file.content));
  const set = new Set(data.slugs || []);
  on ? set.add(slug) : set.delete(slug);
  data.slugs = [...set].sort().reverse();
  try {
    await gh(`/repos/${OWNER}/${REPO}/contents/${PROMOTED_PATH}`, {
      method: 'PUT',
      body: JSON.stringify({ message: `daily: ${on ? 'send' : 'remove'} ${slug} ${on ? 'to' : 'from'} main index`, content: b64encode(JSON.stringify(data, null, 2) + '\n'), sha: file.sha, branch: 'main' })
    });
  } catch (e) {
    if ((e.status === 409 || e.status === 422) && attempt < 2) return setPromoted(slug, on, attempt + 1);
    throw e;
  }
  return set;
}

document.getElementById('list').addEventListener('change', async ev => {
  const box = ev.target;
  if (!box.matches('.promote input')) return;
  const slug = box.dataset.slug, on = box.checked;
  box.disabled = true;
  try {
    promoted = await setPromoted(slug, on);
    toast(on ? 'Sent to the main index. It shows up there in a minute or two.' : 'Removed from the main index.');
  } catch (e) {
    box.checked = !on;
    toast((e.status === 401 || e.status === 403 || e.status === 404) ? 'GitHub refused the change. Check the Publisher token has Contents write access to ' + REPO + '.' : 'Could not save: ' + e.message, true);
  }
  box.disabled = false;
  const label = box.closest('.promote');
  label.classList.toggle('on', box.checked);
  label.querySelector('span').textContent = box.checked ? 'On main index' : 'Send to main index';
});

document.getElementById('q').addEventListener('input', render);

(async () => {
  if (token()) document.body.classList.add('owner');
  try {
    const [m, pr] = await Promise.all([getJSON('manifest.json'), getJSON('promoted.json').catch(() => ({ slugs: [] }))]);
    pieces = (m.pieces || []).slice().sort((a, b) => b.date.localeCompare(a.date) || b.no - a.no);
    promoted = new Set(pr.slugs || []);
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="state"><h3>Couldn’t load the list.</h3><p>' + esc(e.message) + '</p></div>';
    return;
  }
  renderStats();
  render();
})();
</script>
</body>
</html>
